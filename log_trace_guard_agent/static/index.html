<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日志溯源卫士智能体</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.1/dist/index.css">
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.1/theme-chalk/dark/css-vars.css">
  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/guidance.css">
  <link rel="stylesheet" href="/static/css/modules.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <div id="app">
    <template v-if="ready">
      <!-- 全局新手引导遮罩 -->
      <global-tour v-if="showTour" @close="showTour = false" :mode="currentMode"></global-tour>

      <!-- 顶部导航 -->
      <header class="app-header" :class="{ 'is-collapsed': sidebarCollapsed }">
        <div class="header-left">
          <div class="header-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span class="logo-text">日志溯源卫士</span>
          </div>
          <el-button class="sidebar-toggle" :icon="sidebarCollapsed ? 'Expand' : 'Fold'" @click="toggleSidebar" circle size="small" />
        </div>

        <nav class="header-nav">
          <div v-for="mod in modules" :key="mod.key"
               class="nav-tab" :class="{ active: currentModule === mod.key }"
               @click="switchModule(mod.key)">
            <el-icon><component :is="mod.icon" /></el-icon>
            <span>{{ mod.label }}</span>
          </div>
        </nav>

        <div class="header-right">
          <!-- 模式切换 -->
          <el-tooltip :content="currentMode === 'ops' ? '切换至实训模式' : '切换至运维模式'" placement="bottom">
            <el-switch v-model="isTrainingMode" @change="toggleMode"
                       active-text="实训" inactive-text="运维"
                       active-color="#FF7D00" inactive-color="#165DFF" />
          </el-tooltip>
          <!-- 主题切换 -->
          <el-tooltip :content="isDark ? '切换浅色主题' : '切换深色主题'" placement="bottom">
            <el-button :icon="isDark ? 'Sunny' : 'Moon'" @click="toggleTheme" circle size="small" />
          </el-tooltip>
          <!-- 帮助 -->
          <el-tooltip content="查看新手引导" placement="bottom">
            <el-button icon="QuestionFilled" @click="showTour = true" circle size="small" />
          </el-tooltip>
        </div>
      </header>

      <!-- 主体三栏布局 -->
      <div class="app-body" :class="{ 'sidebar-collapsed': sidebarCollapsed }">
        <!-- 左侧菜单 -->
        <aside class="app-sidebar" :class="{ collapsed: sidebarCollapsed }">
          <div v-for="mod in modules" :key="mod.key" class="sidebar-section" v-show="currentModule === mod.key">
            <div class="sidebar-title">{{ mod.label }}</div>
            <div v-for="item in mod.children" :key="item.path"
                 class="sidebar-item" :class="{ active: currentPath === item.path }"
                 @click="navigate(item.path)">
              <el-icon><component :is="item.icon" /></el-icon>
              <span class="sidebar-item-text">{{ item.label }}</span>
            </div>
          </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="app-main" id="main-content">
          <component v-if="viewComponent" :is="viewComponent" :mode="currentMode" />
        </main>
      </div>
    </template>
  </div>

  <!-- Vue3 -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus@2.9.1/dist/index.full.min.js"></script>
  <script src="https://unpkg.com/element-plus@2.9.1/dist/locale/zh-cn.min.js"></script>
  <!-- Element Plus Icons -->
  <script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <!-- App (cache-bust ?v=4) -->
  <script src="/static/js/config.js?v=4"></script>
  <script src="/static/js/api.js?v=4"></script>
  <script src="/static/js/components/guidance.js?v=4"></script>
  <script src="/static/js/components/risk-card.js?v=4"></script>
  <script src="/static/js/components/code-block.js?v=4"></script>
  <script src="/static/js/components/empty-state.js?v=4"></script>
  <script src="/static/js/components/result-guide.js?v=4"></script>
  <script src="/static/js/components/confirm-batch.js?v=4"></script>
  <script src="/static/js/modules/log-parse/identify.js?v=4"></script>
  <script src="/static/js/modules/log-parse/parse.js?v=4"></script>
  <script src="/static/js/modules/log-parse/assess.js?v=4"></script>
  <script src="/static/js/modules/log-parse/batch.js?v=4"></script>
  <script src="/static/js/modules/log-collect/match.js?v=4"></script>
  <script src="/static/js/modules/log-collect/plan.js?v=4"></script>
  <script src="/static/js/modules/log-collect/fault.js?v=4"></script>
  <script src="/static/js/modules/log-collect/arch.js?v=4"></script>
  <script src="/static/js/modules/script-gen/regex.js?v=4"></script>
  <script src="/static/js/modules/script-gen/es-query.js?v=4"></script>
  <script src="/static/js/modules/script-gen/platform.js?v=4"></script>
  <script src="/static/js/modules/script-gen/trace.js?v=4"></script>
  <script src="/static/js/modules/script-gen/optimize.js?v=4"></script>
  <script src="/static/js/modules/compliance/qa.js?v=4"></script>
  <script src="/static/js/modules/compliance/baseline.js?v=4"></script>
  <script src="/static/js/modules/compliance/check.js?v=4"></script>
  <script src="/static/js/modules/training/scenarios.js?v=4"></script>
  <script src="/static/js/modules/training/submit.js?v=4"></script>
  <script src="/static/js/modules/training/report.js?v=4"></script>
  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
