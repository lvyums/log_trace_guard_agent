# ============================================================
# 日志溯源卫士智能体 — Docker Compose 生产编排
# 用法:
#   cp .env.example .env   # 配置密钥
#   docker compose up -d --build
# 数据持久化: ./data/chroma_db(向量库) ./logs(应用日志)
# ============================================================
services:
  log-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: log-trace-guard:latest
    container_name: log-trace-guard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 多 worker 数: 含本地 embedding 模型时建议 1, 纯 API 场景可调大
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
    env_file:
      - .env
    volumes:
      # 向量库持久化(核心数据, 必须备份)
      - ./data/chroma_db:/app/data/chroma_db
      # 上传临时目录
      - ./data/upload_temp:/app/data/upload_temp
      # 应用日志
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 资源限制(企业级: 防止单容器拖垮宿主机)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
        reservations:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
