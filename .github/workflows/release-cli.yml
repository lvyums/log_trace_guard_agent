name: Release CLI Package

on:
  push:
    branches: [main]
    paths:
      - 'log_trace_guard_cli/**'

# 同日多次 push CLI 变更会生成相同日期 tag（vX.Y.Z-YYYYMMDD），
# 并行运行会互相竞争同 tag 的 release。排队执行，避免 race。
concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 需要完整历史以生成 changelog（git describe / git log）

      - name: Generate CHANGELOG
        run: |
          python3 scripts/dev/generate_changelog.py
          # 若 CHANGELOG.md 有变更则提交（版本号未变时脚本会跳过，无提交）
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: 自动更新 CHANGELOG [skip ci]"
            git push origin main
          else
            echo "CHANGELOG.md 无变化，跳过提交"
          fi

      - name: Package CLI
        run: |
          zip -r log-guard-cli.zip log_trace_guard_cli/ \
            -x "log_trace_guard_cli/__pycache__/*" \
            -x "log_trace_guard_cli/**/__pycache__/*" \
            -x "log_trace_guard_cli/*.pyc" \
            -x "log_trace_guard_cli/**/*.pyc" \
            -x "log_trace_guard_cli/.pytest_cache/*" \
            -x "log_trace_guard_cli/**/.pytest_cache/*"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' log_trace_guard_cli/pyproject.toml | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # 幂等处理：tag 是日期版（vX.Y.Z-YYYYMMDD），同日重复触发时相同。
          # gh release create 遇到已存在的 release 会直接失败（exit 1），
          # 导致同一天第二次 push CLI 变更时 CI 红。先查重，存在则删除重建。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG 已存在（同日重复触发），删除后重建"
            # --cleanup-tag: 连同 tag 一起删，让 gh 从最新 HEAD 重建 tag
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # 用 gh CLI 创建 release（runner 预装，不依赖 Node runtime，无 Node20 弃用告警）
          # --generate-notes: GitHub 自动从 commits 生成变更说明，无需手写 body
          gh release create "$TAG" log-guard-cli.zip \
            --title "CLI $TAG" \
            --generate-notes \
            --draft=false \
            --prerelease=false
