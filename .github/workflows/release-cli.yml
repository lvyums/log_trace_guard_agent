name: Release CLI Package

on:
  push:
    branches: [main]
    paths:
      - 'log_trace_guard_cli/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 需要完整历史以生成 changelog（git describe / git log）

      - name: Generate CHANGELOG
        run: |
          python3 scripts/dev/generate_changelog.py
          # 若 CHANGELOG.md 有变更则提交（版本号未变时脚本会跳过，无提交）
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: 自动更新 CHANGELOG [skip ci]"
            git push origin main
          else
            echo "CHANGELOG.md 无变化，跳过提交"
          fi

      - name: Package CLI
        run: |
          zip -r log-guard-cli.zip log_trace_guard_cli/ \
            -x "log_trace_guard_cli/__pycache__/*" \
            -x "log_trace_guard_cli/**/__pycache__/*" \
            -x "log_trace_guard_cli/*.pyc" \
            -x "log_trace_guard_cli/**/*.pyc" \
            -x "log_trace_guard_cli/.pytest_cache/*" \
            -x "log_trace_guard_cli/**/.pytest_cache/*"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' log_trace_guard_cli/pyproject.toml | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "CLI ${{ steps.version.outputs.tag }}"
          body: |
            ## 日志溯源卫士 CLI v${{ steps.version.outputs.version }}

            ### 功能
            - 6 大业务模块：日志解析 / 日志采集 / 脚本生成 / 合规审计 / 联合日志审查 / AI 对话
            - script-gen 增强：溯源报告导出、ES 查询模板管理、溯源→监控规则、Splunk SPL 一键执行
            - Splunk/ES 连接测试与搜索（--splunk-test / --splunk-search / --es-test / --es-search，退出码 0/1/2）

            ### 安装
            ```bash
            # 下载解压后
            cd log_trace_guard_cli
            pip install -e .

            # 运行
            log-guard
            ```
          files: log-guard-cli.zip
          generate_release_notes: true
          draft: false
          prerelease: false
