name: Release CLI Package

on:
  push:
    branches: [main]
    paths:
      - 'log_trace_guard_cli/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 需要完整历史以生成 changelog（git describe / git log）

      - name: Generate CHANGELOG
        run: |
          python3 scripts/dev/generate_changelog.py
          # 若 CHANGELOG.md 有变更则提交（版本号未变时脚本会跳过，无提交）
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: 自动更新 CHANGELOG [skip ci]"
            git push origin main
          else
            echo "CHANGELOG.md 无变化，跳过提交"
          fi

      - name: Package CLI
        run: |
          zip -r log-guard-cli.zip log_trace_guard_cli/ \
            -x "log_trace_guard_cli/__pycache__/*" \
            -x "log_trace_guard_cli/**/__pycache__/*" \
            -x "log_trace_guard_cli/*.pyc" \
            -x "log_trace_guard_cli/**/*.pyc" \
            -x "log_trace_guard_cli/.pytest_cache/*" \
            -x "log_trace_guard_cli/**/.pytest_cache/*"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' log_trace_guard_cli/pyproject.toml | sed 's/.*= *"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 gh CLI 创建 release（runner 预装，不依赖 Node runtime，无 Node20 弃用告警）
          # --generate-notes: GitHub 自动从 commits 生成变更说明，无需手写 body
          gh release create "${{ steps.version.outputs.tag }}" log-guard-cli.zip \
            --title "CLI ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --draft=false \
            --prerelease=false
