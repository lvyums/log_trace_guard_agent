name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log_trace_guard_cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log_trace_guard_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
        env:
          # sentence-transformers pulls torch (~2GB); skip in CI if not needed
          PIP_NO_BUILD_ISOLATION: "false"
      - run: python -m pytest tests/ -v --timeout=60
