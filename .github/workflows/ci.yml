name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: log_trace_guard_cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: CLI 单元测试(含覆盖率门槛 35%)
        # 排除交互菜单层 cli.py(1409行,UI代码不纳入覆盖率统计)与可选采集模块
        run: python -m pytest tests/ -v --cov=log_guard --cov-fail-under=35
